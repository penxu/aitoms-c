# Atoms 生产部署 Nginx 配置样例
#
# 结构：
#   浏览器 → Nginx(:80/443) → Next.js(:3000) → 用户项目服务(127.0.0.1:4000-4999)
#
# 关键点：
#   1. /p/ 子路径整体转发给 Next.js，由 Next 的 catch-all Route Handler 再转发到项目端口
#   2. 必须透传 Upgrade / Connection，否则用户项目的 HMR WebSocket 无法建立
#   3. 关闭对 /p/ 与 /s/ 的缓冲，并放宽读写超时，避免长连接 / 流式响应被切断

upstream atoms_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 非 Upgrade 请求把 Connection 置空，才能复用上面的 upstream keepalive；
# 写成 close 会让每个普通请求都新建连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name atoms.example.com;

    client_max_body_size 32m;

    # 平台主应用
    location / {
        proxy_pass         http://atoms_next;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # 用户项目子路径转发（含 WebSocket / HMR）
    location /p/ {
        proxy_pass         http://atoms_next;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 固定生产版本，与开发预览 /p/ 分开；保留 /s/ 前缀。
    # 同样透传 Upgrade，生产版本里的用户代码可能自建 WebSocket / SSE。
    location /s/ {
        proxy_pass http://atoms_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next.js 静态资源（文件名带 hash，由 add_header 实现浏览器端不可变缓存）
    location /_next/static/ {
        proxy_pass http://atoms_next;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
