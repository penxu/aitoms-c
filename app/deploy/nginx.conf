# Atoms 生产部署 Nginx 配置样例
#
# 结构：
#   浏览器 → Nginx(:80/443) → Next.js(:3000) → 用户项目服务(127.0.0.1:4000-4999)
#
# 关键点：
#   1. /p/ 子路径整体转发给 Next.js，由 Next 的 catch-all Route Handler 再转发到项目端口
#   2. 必须透传 Upgrade / Connection，否则用户项目的 HMR WebSocket 无法建立
#   3. 关闭对 /p/ 的缓冲与超时限制，避免长连接被切断

upstream atoms_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name atoms.example.com;

    client_max_body_size 32m;

    # 平台主应用
    location / {
        proxy_pass         http://atoms_next;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # 用户项目子路径转发（含 WebSocket / HMR）
    location /p/ {
        proxy_pass         http://atoms_next;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next.js 静态资源
    location /_next/static/ {
        proxy_pass http://atoms_next;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
